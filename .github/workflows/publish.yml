name: Publish

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - run: bun install --frozen-lockfile

      - name: Lint & Type check
        run: bun run lint && bun run typecheck

      - name: Test
        run: bun run test

      - name: Bundle
        run: bun run bundle

      - name: Package
        run: bunx @vscode/vsce package --no-dependencies --out ghostty.vsix

      - name: Publish to VS Code Marketplace
        run: bunx @vscode/vsce publish --no-dependencies --packagePath ghostty.vsix
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}

      - name: Publish to Open VSX
        run: bunx ovsx publish ghostty.vsix
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}

      - name: Create GitHub Release
        run: gh release create "${{ github.ref_name }}" ghostty.vsix --title "${{ github.ref_name }}" --generate-notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
