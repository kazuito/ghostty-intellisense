name: Publish

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  publish:
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - run: bun install --frozen-lockfile

      - name: Bundle
        run: bun run bundle

      - name: Package
        run: bunx @vscode/vsce package --no-dependencies --out ghostty.vsix

      - name: Publish to VS Code Marketplace
        run: bunx @vscode/vsce publish --no-dependencies --packagePath ghostty.vsix
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}

      # OIDC trusted publishing; the Open VSX registration is bound to this
      # workflow's filename, so renaming publish.yml breaks it.
      - name: Publish to Open VSX
        run: bunx ovsx@1.3.0 publish ghostty.vsix --trusted-publishing

      - name: Create GitHub Release
        run: gh release create "${{ github.ref_name }}" ghostty.vsix --title "${{ github.ref_name }}" --generate-notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
