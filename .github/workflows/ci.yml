name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_call:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  CI:
    # Pinned: the Ghostty .deb in test/ghostty-pin.json is built per Ubuntu
    # release.
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Typecheck
        run: bun run typecheck

      - name: Bundle
        run: bun run bundle

      - name: Install Ghostty
        run: |
          deb="$RUNNER_TEMP/ghostty.deb"
          curl -fsSLo "$deb" "$(jq -r .linux.url test/ghostty-pin.json)"
          echo "$(jq -r .linux.sha256 test/ghostty-pin.json)  $deb" | sha256sum -c -
          sudo apt-get update -qq
          sudo apt-get install -y "$deb"
          ghostty --version

      - name: Test
        run: bun run test

      - name: E2E
        run: xvfb-run -a bun run test:e2e
