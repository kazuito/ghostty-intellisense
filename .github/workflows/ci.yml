name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_call:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  CI:
    # macOS: Ghostty publishes official binaries only for macOS, and
    # test/ghostty-pin.json pins that DMG.
    runs-on: macos-15
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Typecheck
        run: bun run typecheck

      - name: Bundle
        run: bun run bundle

      - name: Install Ghostty
        run: bun run setup:ghostty

      - name: Test
        run: bun run test

      - name: E2E
        run: bun run test:e2e
