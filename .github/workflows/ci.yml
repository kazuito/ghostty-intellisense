name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_call:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  CI:
    # Pinned: the Ghostty .deb below is built per Ubuntu release.
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Typecheck
        run: bun run typecheck

      - name: Bundle
        run: bun run bundle

      - name: Install Ghostty
        run: |
          curl -fsSLo "$RUNNER_TEMP/ghostty.deb" "$GHOSTTY_DEB_URL"
          sudo apt-get update -qq
          sudo apt-get install -y "$RUNNER_TEMP/ghostty.deb"
          ghostty --version
        env:
          # Bumping this may change which overlay values the integration
          # tests' `newerThanInstalled` list needs to skip.
          GHOSTTY_DEB_URL: https://github.com/mkasberg/ghostty-ubuntu/releases/download/1.3.1-0-ppa2/ghostty_1.3.1-0.ppa2_amd64_24.04.deb

      - name: Test
        run: bun run test

      - name: E2E
        run: xvfb-run -a bun run test:e2e
